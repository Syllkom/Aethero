<rect x="30.0" y="10" width="290" height="210" rx="16" fill="url(#cd)" stroke="#f43f5e" stroke-opacity="0.28" stroke-width="1.5"/><rect x="54.0" y="34" width="52" height="52" rx="14" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-opacity="0.4"/><g transform="translate(80.0,60)"><path d="M0-16L14-10V2C14 11 7 17 0 20C-7 17-14 11-14 2V-10Z" fill="none" stroke="#fb7185" stroke-width="2.2" stroke-linejoin="round"/><path d="M-5 2L-1 6L6-3" fill="none" stroke="#fda4af" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="54.0" y="126" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#ffe4e6">Aislado</text><text x="54.0" y="154" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#c99aa3">El bot corre en un proceso</text><text x="54.0" y="176" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#c99aa3">hijo supervisado y se levanta</text><text x="54.0" y="198" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#c99aa3">solo si se cae.</text><rect x="340.0" y="10" width="290" height="210" rx="16" fill="url(#cd)" stroke="#f43f5e" stroke-opacity="0.28" stroke-width="1.5"/><rect x="364.0" y="34" width="52" height="52" rx="14" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-opacity="0.4"/><g transform="translate(390.0,60)"><path d="M3-18L-10 3H-1L-4 18L11-5H2Z" fill="none" stroke="#fb7185" stroke-width="2.2" stroke-linejoin="round"/></g><text x="364.0" y="126" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#ffe4e6">Hot-reload</text><text x="364.0" y="154" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#c99aa3">Plugins, handlers, scrapers y</text><text x="364.0" y="176" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#c99aa3">builders se recargan al</text><text x="364.0" y="198" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#c99aa3">guardar el archivo.</text><rect x="650.0" y="10" width="290" height="210" rx="16" fill="url(#cd)" stroke="#f43f5e" stroke-opacity="0.28" stroke-width="1.5"/><rect x="674.0" y="34" width="52" height="52" rx="14" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-opacity="0.4"/><g transform="translate(700.0,60)"><rect x="-16" y="-14" width="10" height="10" rx="2.5" fill="none" stroke="#fb7185" stroke-width="2.2"/><rect x="-5" y="-5" width="10" height="10" rx="2.5" fill="none" stroke="#fda4af" stroke-width="2.2"/><rect x="6" y="4" width="10" height="10" rx="2.5" fill="none" stroke="#fb7185" stroke-width="2.2"/></g><text x="674.0" y="126" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#ffe4e6">Pipeline</text><text x="674.0" y="154" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#c99aa3">Cada mensaje cruza handlers</text><text x="674.0" y="176" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#c99aa3">ordenados por prioridad y</text><text x="674.0" y="198" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#c99aa3">enriquece el objeto m.</text><rect x="960.0" y="10" width="290" height="210" rx="16" fill="url(#cd)" stroke="#f43f5e" stroke-opacity="0.28" stroke-width="1.5"/><rect x="984.0" y="34" width="52" height="52" rx="14" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-opacity="0.4"/><g transform="translate(1010.0,60)"><circle cx="0" cy="-10" r="5" fill="none" stroke="#fb7185" stroke-width="2.2"/><circle cx="-12" cy="10" r="5" fill="none" stroke="#fda4af" stroke-width="2.2"/><circle cx="12" cy="10" r="5" fill="none" stroke="#fb7185" stroke-width="2.2"/><path d="M-2-5L-9 6M2-5L9 6" stroke="#fb7185" stroke-width="2" opacity=".6"/></g><text x="984.0" y="126" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#ffe4e6">Sub-bots</text><text x="984.0" y="154" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#c99aa3">Más números en workers</text><text x="984.0" y="176" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#c99aa3">aislados, cada uno con su</text><text x="984.0" y="198" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#c99aa3">propia sesión.</text></svg>